server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Mesmo limite de 5 MB da API, com folga para o multipart.
  client_max_body_size 6m;

  location /api/ {
    # Resolve o nome "api" a cada requisição (DNS do Docker), para continuar
    # funcionando quando o container da API é recriado e muda de IP.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:3333;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  # Rotas do React Router (ex.: /candidatos/1) devolvem o index.html.
  location / {
    try_files $uri /index.html;
  }
}
