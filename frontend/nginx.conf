server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Mesmo limite de 5 MB da API, com folga para o multipart.
  client_max_body_size 6m;

  location /api/ {
    proxy_pass http://api:3333;
    proxy_set_header Host $host;
  }

  # Rotas do React Router (ex.: /candidatos/1) devolvem o index.html.
  location / {
    try_files $uri /index.html;
  }
}
